name: CI

# Runs on pushes to main, on every pull request, and when started manually.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Minimal permissions: the jobs only need to read the code.
permissions:
  contents: read

jobs:
  # Lint runs once, on Node 22.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs Node and caches npm downloads, keyed by package-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Tests start only after lint passes, and run on Node 22 and 24 in parallel.
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # if one Node version fails, the other still finishes
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # pretest:ci runs automatically first and creates the reports/ folder.
      - run: npm run test:ci
      # Always uploads reports/, whether the tests passed, failed, or the run was cancelled.
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-node-${{ matrix.node-version }} # each Node version needs its own artifact name
          path: reports/
